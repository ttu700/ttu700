<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="270" rx="10" fill="#ffffff"/>

  <!-- boxes -->
  <g font-size="13" text-anchor="middle" fill="#111">
    <rect x="15" y="100" width="130" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="80" y="124">Engineer</text><text x="80" y="141">question</text>

    <rect x="175" y="100" width="140" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="245" y="124">Query rewriter</text><text x="245" y="141" fill="#555">Claude Haiku</text>

    <polygon points="385,92 425,128 385,164 345,128" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="385" y="133">Router</text>

    <rect x="480" y="30" width="140" height="56" rx="18" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="550" y="54">PostgreSQL</text><text x="550" y="71" fill="#555">sensor data</text>

    <rect x="480" y="170" width="140" height="56" rx="18" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="550" y="194">Qdrant</text><text x="550" y="211" fill="#555">semantic search</text>

    <rect x="655" y="100" width="180" height="56" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="745" y="124">Answer generator</text><text x="745" y="141" fill="#555">Claude Sonnet + guardrails</text>

    <rect x="860" y="100" width="130" height="56" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="925" y="124">Streamlit UI</text><text x="925" y="141" fill="#555">charts + feedback</text>
  </g>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="145" y1="128" x2="173" y2="128"/>
    <line x1="315" y1="128" x2="343" y2="128"/>
    <path d="M405,110 L440,58 L478,58"/>
    <path d="M405,146 L440,198 L478,198"/>
    <path d="M620,58 L640,58 L640,118 L653,118"/>
    <path d="M620,198 L640,198 L640,138 L653,138"/>
    <line x1="835" y1="128" x2="858" y2="128"/>
  </g>

  <!-- edge labels -->
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="428" y="78">exact numbers</text>
    <text x="428" y="186">search by meaning</text>
  </g>

  <!-- legend -->
  <rect x="700" y="236" width="14" height="14" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="721" y="248" font-size="12" fill="#333">My part: generation and frontend</text>
</svg>
